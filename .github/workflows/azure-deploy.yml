name: Build and deploy to Azure

# Builds the React app, folds it into the FastAPI backend, and ships the whole
# thing to a single Azure App Service.
#
# Before the first run you must:
#   1. Create the App Service (see README -> "Deploying to Azure").
#   2. Add the publish profile as a repository secret named
#      AZURE_WEBAPP_PUBLISH_PROFILE.
#   3. Set AZURE_WEBAPP_NAME below to your App Service name.
#
# Secrets such as MONGODB_URI and JWT_SECRET are NEVER in this repo — they live
# in the App Service's Environment variables / Application settings.
#
# NOTE: the live deployment currently runs on Render (see DEPLOY.md), so this
# workflow is manual-only. Without an App Service and the publish-profile
# secret it fails at the last step, and firing it on every push to main would
# mark every commit red for no reason. Re-add the `push` trigger if you move
# back to Azure.

on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hellokids-school-management
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.12'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Fold the frontend build into the backend
        run: |
          rm -rf backend/static
          mkdir -p backend/static
          cp -r frontend/dist/* backend/static/
          echo "Static payload:"
          ls -la backend/static

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sanity-check the backend imports
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import app.main; print('backend imports OK')"

      - name: Run the offline test suite
        working-directory: backend
        run: python tests/test_fee_logic.py

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
